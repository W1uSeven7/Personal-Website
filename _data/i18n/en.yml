intro:
  greeting: Hello
  welcome: Welcome to my website!
  paragraphs:
    - "Hi! I'm Qi Wu, an undergraduate in Information Management and Information Systems at Southwest University (2023-2027)."
    - "After one development internship and one product internship, I have a clearer sense of where I want to go: becoming an AI Product Builder. To me, that means thinking about why something should be built alongside how to build it, starting with real needs, turning ideas into usable products, and improving them through user feedback."
    - "I have hands-on experience in both product design and programming, and use AI tools such as Codex and Cursor to prototype, develop, and iterate. During my product management internship, I was responsible for iterating on an app for international markets, leading requirements analysis, solution design, and cross-functional collaboration. During my product development internship, I used AI tools to build an advertising automation system to reduce repetitive work. As product lead for a WeChat mini program, I guided the product from user research and prototyping through development, testing, and launch. These experiences taught me to test assumptions with working software and learn from real use."
    - "I follow AI-native products, agents, and productivity tools, with a particular interest in education and products for international markets. AI makes ideas cheaper to test; a Builder still needs to understand the value of a problem, the limits of a model, and how to measure whether a product works. I hope to bring together my product perspective, development skills, and study-abroad experience to build useful, reliable products that people keep using."
