  investment_start: "第一次接触基金理财，开始学习长期投资与资产配置."
  teaching: "继续深入体验教育行业，担任幼儿园英语老师，用全英文教学点燃孩子们的学习热情."
  tutoring: "来到上海担任托福雅思助教和英语家教，深入教育行业，体验AI+教育方向的工作."
  ucsd: "在 UCSD 开启交换生活，看见更大的世界."
