{% include i18n.html %}
<script>window.siteI18n = {{ site_i18n.ui | jsonify }};</script>
<script src="{{ base_path }}/assets/js/main.min.js"></script>
<script src="{{ '/assets/js/language-switch.js' | relative_url }}" defer></script>
<script>
(function() {
  function setContactOpen(wrapper, open) {
    var button = wrapper.querySelector('button');
    var list = wrapper.querySelector('.author__urls');
    wrapper.classList.toggle('is-open', open);
    button.setAttribute('aria-expanded', String(open));
    if (window.getComputedStyle(button).display !== 'none') {
      list.style.display = open ? 'block' : 'none';
    }
  }

  function closeAll() {
    document.querySelectorAll('.author__urls-wrapper.is-open').forEach(function(wrapper) {
      setContactOpen(wrapper, false);
    });
  }

  function init() {
    document.querySelectorAll('.author__urls-wrapper').forEach(function(wrapper) {
      var button = wrapper.querySelector('button');
      var list = wrapper.querySelector('.author__urls');
      if (!button || !list) return;

      button.addEventListener('click', function(event) {
        event.preventDefault();
        event.stopPropagation();
        setContactOpen(wrapper, !wrapper.classList.contains('is-open'));
      });
    });

    document.addEventListener('click', function() {
      closeAll();
    });

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeAll();
    });

    document.querySelectorAll('.js-copy-email').forEach(function(link) {
      link.addEventListener('click', function(event) {
        event.preventDefault();

        var email = link.getAttribute('data-email');
        if (!email) return;

        function showCopied() {
          var label = link.querySelector('.email-label');
          var oldText = link.getAttribute('data-original-text') || label.textContent.trim();
          link.setAttribute('data-original-text', oldText);
          link.classList.add('is-copied');
          label.textContent = link.getAttribute('data-copied-label');

          window.clearTimeout(link._copyTimer);
          link._copyTimer = window.setTimeout(function() {
            link.classList.remove('is-copied');
            label.textContent = oldText;
          }, 1600);
        }

        function fallbackCopy() {
          var textarea = document.createElement('textarea');
          textarea.value = email;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          var copied = document.execCommand('copy');
          document.body.removeChild(textarea);
          if (copied) showCopied();
        }

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(email).then(showCopied).catch(fallbackCopy);
        } else {
          fallbackCopy();
        }
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
